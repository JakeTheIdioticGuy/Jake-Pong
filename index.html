<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Jake Pong</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:22px;letter-spacing:1px}.brand span{color:#62f6c7}
.pill{font-size:12px;color:#9fb0c7;border:1px solid #23344d;border-radius:99px;padding:6px 10px}
#score{display:flex;justify-content:center;align-items:center;gap:24px;font-size:clamp(30px,8vw,48px);font-weight:800;line-height:1}
.scoreSide{min-width:55px;text-align:center}.dash{color:#52637b}
#arena{position:relative;flex:1;min-height:0;border:1px solid #263d58;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at center,#122944 0%,#09182a 72%);box-shadow:inset 0 0 40px #0006}
#game{width:100%;height:100%;display:block}
.hint{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:12px;color:#a8bad0;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bbd;padding:22px;text-align:center}
.panel{max-width:290px}.panel h1{font-size:30px;margin:0 0 8px}.panel p{color:#aebed2;font-size:14px;line-height:1.5;margin:0 0 18px}
button{border:0;border-radius:12px;background:#62f6c7;color:#062019;font-size:16px;font-weight:850;padding:13px 24px}
footer{display:flex;align-items:center;justify-content:center;gap:9px;color:#8fa2bb;font-size:12px;padding:2px}
footer img{width:32px;height:32px;object-fit:cover;border-radius:50%;border:1px solid #38506c}
.credit strong{color:#e5edf8} .credit{line-height:1.4}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">JAKE<span>PONG</span></div><div class="pill">PLAYER vs CPU</div></header>
<div id="score"><div class="scoreSide" id="you">0</div><div class="dash">:</div><div class="scoreSide" id="cpu">0</div></div>
<div id="arena">
<canvas id="game"></canvas>
<div class="hint">DRAG YOUR PADDLE TO MOVE</div>
<div id="overlay"><div class="panel"><h1>Ping Pong</h1><p>First to 7 points wins. Drag your paddle or touch the left side to move.</p><button id="start">PLAY</button></div></div>
</div>
<footer><img src="profile.jpg" alt="Credit profile"><div class="credit">Made with ping-pong energy<br><strong>Credit: jake.wav</strong></div></footer>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const arena=document.getElementById('arena'), overlay=document.getElementById('overlay');
let W=0,H=0,dpr=1, running=false, raf=0, last=0, you=0,cpu=0;
let p={x:22,y:0,w:10,h:76}, ai={x:0,y:0,w:10,h:76};
let ball={x:0,y:0,r:7,vx:4,vy:2};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
 const r=arena.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2); W=r.width;H=r.height;
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 p.x=18;p.w=10;p.h=clamp(H*.19,58,88);ai.x=W-28;ai.w=10;ai.h=p.h;
 if(!running) resetBall(Math.random()<.5?1:-1);
 draw();
}
function resetBall(dir){ball={x:W/2,y:H/2,r:7,vx:dir*(3.4+Math.random()*1.2),vy:(Math.random()-.5)*4};p.y=H/2-p.h/2;ai.y=H/2-ai.h/2}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#2b4360';ctx.lineWidth=2;ctx.setLineDash([7,10]);ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#e8f1ff';ctx.fillRect(p.x,p.y,p.w,p.h);
 ctx.fillStyle='#62f6c7';ctx.fillRect(ai.x,ai.y,ai.w,ai.h);
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
}
function frame(t){
 if(!running)return;
 const dt=Math.min((t-last)/16.67||1,2);last=t;
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.y<ball.r||ball.y>H-ball.r){ball.vy*=-1;ball.y=clamp(ball.y,ball.r,H-ball.r)}
 // CPU follows the ball with a small reaction delay
 const target=ball.y-ai.h/2;ai.y+=clamp(target-ai.y,-3.5*dt,3.5*dt);ai.y=clamp(ai.y,0,H-ai.h);
 if(ball.vx<0 && ball.x-ball.r<=p.x+p.w && ball.x>p.x && ball.y>=p.y && ball.y<=p.y+p.h){
  ball.x=p.x+p.w+ball.r;ball.vx=Math.abs(ball.vx)*1.04;
  ball.vy=((ball.y-(p.y+p.h/2))/(p.h/2))*5.2;
 }
 if(ball.vx>0 && ball.x+ball.r>=ai.x && ball.x<ai.x+ai.w && ball.y>=ai.y && ball.y<=ai.y+ai.h){
  ball.x=ai.x-ball.r;ball.vx=-Math.abs(ball.vx)*1.03;
  ball.vy=((ball.y-(ai.y+ai.h/2))/(ai.h/2))*4.8;
 }
 if(ball.x<-10){cpu++;document.getElementById('cpu').textContent=cpu;point(-1);return}
 if(ball.x>W+10){you++;document.getElementById('you').textContent=you;point(1);return}
 draw();raf=requestAnimationFrame(frame);
}
function point(dir){
 if(you>=7||cpu>=7){
  running=false;overlay.style.display='flex';
  overlay.querySelector('h1').textContent=you>=7?'YOU WIN!':'CPU WINS!';
  overlay.querySelector('p').textContent=`Final score: ${you} : ${cpu}. Tap below to play again.`;
  overlay.querySelector('button').textContent='PLAY AGAIN';return;
 }
 resetBall(dir);draw();last=performance.now();raf=requestAnimationFrame(frame);
}
function start(){you=0;cpu=0;document.getElementById('you').textContent='0';document.getElementById('cpu').textContent='0';overlay.style.display='none';running=true;resetBall(Math.random()<.5?1:-1);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
document.getElementById('start').addEventListener('click',start);
function move(y){const r=arena.getBoundingClientRect();p.y=clamp(y-r.top-p.h/2,0,H-p.h);if(!running)draw()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e.clientY)});
canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientY)});
window.addEventListener('resize',resize);resize();
</script>
</body></html>
